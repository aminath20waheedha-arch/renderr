name: Render Balance 100x

on:
  workflow_dispatch:
    inputs:
      resolution:
        description: "720p is about 2x faster"
        default: "1080p"
        type: choice
        options: ["720p", "1080p"]
      style:
        description: "Look"
        default: "dusk"
        type: choice
        options: ["dusk", "midnight", "golden", "neon", "storybook"]
      preview:
        description: "Only render the first 30 s at half size (quick test)"
        default: false
        type: boolean

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the project
        run: unzip -o -q balance*.zip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg, Python and Node dependencies
        working-directory: aitrends-2d-studio
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install numpy scipy
          npm install
          npx playwright install --with-deps chromium

      - name: Set resolution and style
        working-directory: aitrends-2d-studio
        run: |
          python - <<'PY'
          import json
          p = "projects/balance-100x/config.json"
          c = json.load(open(p))
          c["resolution"] = "${{ github.event.inputs.resolution }}"
          c["style"] = "${{ github.event.inputs.style }}"
          json.dump(c, open(p, "w"), indent=2)
          print(c)
          PY

      - name: Preview (first 30 s)
        if: ${{ github.event.inputs.preview == 'true' }}
        working-directory: aitrends-2d-studio
        run: node render.mjs --project projects/balance-100x --from 0 --to 30 --scale 0.5 --format jpeg

      - name: Render frames
        if: ${{ github.event.inputs.preview != 'true' }}
        working-directory: aitrends-2d-studio
        run: node render.mjs --project projects/balance-100x --format jpeg 2>&1 | tee build-render.log | tail -n 60

      - name: Mix music, SFX and voice, then mux the MP4
        if: ${{ github.event.inputs.preview != 'true' }}
        working-directory: aitrends-2d-studio
        run: |
          python audio/mix.py --project projects/balance-100x
          ls -lh projects/balance-100x/out

      - name: Upload the finished video
        if: ${{ github.event.inputs.preview != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: balance-100x-mp4
          path: aitrends-2d-studio/projects/balance-100x/out/*.mp4
          retention-days: 14

      - name: Upload the preview
        if: ${{ github.event.inputs.preview == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: balance-100x-preview
          path: aitrends-2d-studio/projects/balance-100x/build/preview.mp4
          retention-days: 7
