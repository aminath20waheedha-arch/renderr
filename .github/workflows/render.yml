name: Render the episode
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # If you uploaded the zip as-is (no unzipping), unpack it here.
      - name: Unpack the zip if the project is still zipped
        run: |
          if [ ! -d studio ]; then
            Z=$(ls *.zip | head -n 1)
            unzip -q "$Z"
            D=$(find . -maxdepth 2 -type d -name studio | head -n 1)
            echo "PROJECT_DIR=$(dirname "$D")" >> "$GITHUB_ENV"
          else
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: System packages (ffmpeg and the libraries Chrome needs)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0t64 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2t64 || true

      - name: Install
        working-directory: ${{ env.PROJECT_DIR }}/studio
        run: |
          npm ci
          npx remotion browser ensure

      - name: Render (about 3,750 frames, 2:05)
        working-directory: ${{ env.PROJECT_DIR }}/studio
        run: |
          mkdir -p out
          npx remotion render src/index.ts HeartSwapLong out/heart-swap-long-raw.mp4 --log error --gl=swangle --concurrency 4

      - name: Master the audio (-14 LUFS)
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 finalize.py studio/out/heart-swap-long-raw.mp4 what-if-heart-swap-2min.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: what-if-heart-swap-2min
          path: ${{ env.PROJECT_DIR }}/what-if-heart-swap-2min.mp4
          retention-days: 14
